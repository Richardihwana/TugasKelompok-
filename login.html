<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Kelas Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #00bcd4;
      --secondary-color: #263238;
      --accent-color: #ffc107;
      --text-color: #fff;
      --overlay-gradient: linear-gradient(135deg, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8));
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: #000;
      color: var(--text-color);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .background {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=compress&cs=tinysrgb&dpr=2&h=1200&w=1600');
      background-position: center;
      background-size: cover;
      z-index: -2;
    }
    .overlay {
      background: var(--overlay-gradient);
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }
    header {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .header__logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-color);
      font-weight: 600;
      text-decoration: none;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .header__logo img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fff;
      padding: 6px;
    }
    .menu-toggle {
      display: none;
      font-size: 2rem;
      color: var(--accent-color);
      background: none;
      border: none;
      cursor: pointer;
    }
    nav {
      flex-grow: 1;
      text-align: right;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 1.2rem;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: nowrap;
    }
    nav a {
      text-decoration: none;
      color: #ddd;
      font-weight: 500;
      position: relative;
      padding: 0.4rem 0.5rem;
      transition: color 0.3s ease;
      white-space: nowrap;
    }
    nav a::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent-color);
      transition: width 0.3s ease;
    }
    nav a:hover::after,
    nav a.active::after {
      width: 100%;
    }
    nav a:hover {
      color: var(--accent-color);
    }
    .btn {
      background: var(--accent-color);
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease;
      white-space: nowrap;
      cursor: pointer;
      border: none;
    }
    .btn::before {
      content: "";
      position: absolute;
      left: -50%;
      top: 0;
      width: 0;
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      transform: skewX(-20deg);
      transition: width 0.4s;
      z-index: 1;
    }
    .btn:hover::before {
      width: 200%;
    }
    .btn:hover {
      transform: scale(1.05);
    }

    /* Responsive nav */
    @media (max-width: 768px) {
      header {
        padding: 1rem;
      }
      .menu-toggle {
        display: block;
      }
      nav ul {
        flex-direction: column;
        background: rgba(0,0,0,0.85);
        position: absolute;
        top: 60px;
        right: 2rem;
        width: 200px;
        border-radius: 8px;
        padding: 1rem 0;
        display: none;
        box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        z-index: 15;
      }
      nav ul.show {
        display: flex;
      }
      nav li {
        text-align: center;
        margin: 0.5rem 0;
      }
      nav a {
        padding: 0.6rem 1rem;
        font-size: 1rem;
        display: block;
      }
      nav a.btn {
        margin: 0 auto;
        width: fit-content;
      }
      nav {
        position: relative;
        flex-grow: 0;
        text-align: right;
      }
    }

    /* Login form */
    main {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.1);
      padding: 2.5rem 3rem;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgb(0 0 0 / 0.6);
      max-width: 400px;
      width: 100%;
      color: var(--text-color);
      backdrop-filter: blur(8px);
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--accent-color);
      font-weight: 600;
      font-size: 2rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--primary-color);
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 1rem;
      margin-bottom: 1.5rem;
      border-radius: 30px;
      border: none;
      font-size: 1rem;
      outline: none;
      transition: box-shadow 0.3s ease;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      box-shadow: 0 0 8px var(--accent-color);
      background-color: rgba(255 255 255 / 0.15);
      color: var(--text-color);
    }
    .btn-login {
      width: 100%;
      font-size: 1.1rem;
      padding: 0.75rem;
      border-radius: 30px;
      border: none;
      background: var(--accent-color);
      color: #000;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }
    .btn-login:hover {
      background-color: #ffde03;
    }
    .forgot-password {
      text-align: right;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .forgot-password a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    .forgot-password a:hover {
      color: var(--accent-color);
    }
    .register-link {
      text-align: center;
      font-size: 0.95rem;
      margin-top: 1rem;
      color: #bbb;
    }
    .register-link a {
      color: var(--accent-color);
      font-weight: 600;
      text-decoration: none;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="overlay"></div>

  <header>
    <a href="index.html" class="header__logo">
      <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" alt="Logo" />
      Kelas Online
    </a>

    <button class="menu-toggle" aria-label="Toggle menu">
      <i class="bi bi-list"></i>
    </button>

    <nav>
      <ul>
        <li><a href="index.html" class="nav__link">Beranda</a></li>
        <li><a href="about.html" class="nav__link">Tentang</a></li>
        <li><a href="courses.html" class="nav__link">Kursus</a></li>
        <li><a href="kontak.html" class="nav__link">Kontak</a></li>
        <li><a href="login.html" class="btn nav__login active">Login</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="login-container" aria-label="Form Login Pengguna">
      <h2>Masuk ke Akun Anda</h2>
      <form action="#" method="POST" autocomplete="off">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="email@domain.com" required />

        <label for="password">Kata Sandi</label>
        <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" required />

        <div class="forgot-password">
          <a href="#">Lupa kata sandi?</a>
        </div>

        <button type="submit" class="btn-login">Masuk</button>
      </form>
      <p class="register-link">
        Belum punya akun? <a href="register.html">Daftar di sini</a>
      </p>
    </section>
  </main>

  <script>
    // Toggle mobile menu
    const menuToggle = document.querySelector('.menu-toggle');
    const navUl = document.querySelector('nav ul');

    menuToggle.addEventListener('click', () => {
      navUl.classList.toggle('show');
    });

    navUl.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        navUl.classList.remove('show');
      });
    });
  </script>
</body>
</html>
