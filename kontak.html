<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kontak Kami - Kelas Online</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
<style>
:root {
  --primary-color: #00bcd4;
  --accent-color: #ffc107;
  --text-color: #fff;
  --overlay-gradient: linear-gradient(135deg, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8));
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #000;
  color: var(--text-color);
  overflow-x: hidden;
  line-height: 1.6;
}

.background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=compress&cs=tinysrgb&dpr=2&h=1200&w=1600');
  background-size: cover;
  background-position: center;
  z-index: -2;
}

.overlay {
  background: var(--overlay-gradient);
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

header {
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(6px);
  padding: 1rem 2rem;
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

.header__logo {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--accent-color);
  font-weight: 600;
  text-decoration: none;
  font-size: 1.5rem;
}

.header__logo img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #fff;
  padding: 6px;
}

nav {
  flex-grow: 1;
  text-align: right;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 1.2rem;
  justify-content: flex-end;
  align-items: center;
}

nav a {
  text-decoration: none;
  color: #ddd;
  font-weight: 500;
  position: relative;
  padding: 0.4rem 0.5rem;
  transition: color 0.3s ease;
  white-space: nowrap;
}

nav a::after {
  content: "";
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--accent-color);
  transition: width 0.3s ease;
}

nav a:hover::after,
nav a.active::after {
  width: 100%;
}

nav a:hover {
  color: var(--accent-color);
}

.btn {
  background: var(--accent-color);
  color: #000;
  padding: 0.5rem 1rem;
  border-radius: 25px;
  text-decoration: none;
  font-weight: 600;
  white-space: nowrap;
  display: inline-block;
}

main {
  max-width: 600px;
  margin: 4rem auto;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 2rem;
}

h2 {
  text-align: center;
  color: var(--accent-color);
  margin-bottom: 1rem;
}

p.description {
  text-align: center;
  margin-bottom: 2rem;
  color: #ccc;
}

form {
  display: grid;
  gap: 1rem;
}

input, textarea {
  width: 100%;
  padding: 0.8rem;
  border: none;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  resize: none;
}

input:focus, textarea:focus {
  outline: 2px solid var(--accent-color);
  background: rgba(255, 255, 255, 0.2);
}

button {
  background: var(--accent-color);
  color: #000;
  border: none;
  border-radius: 25px;
  padding: 0.8rem 1.5rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.3s ease;
}

button:hover {
  transform: scale(1.05);
}

footer {
  text-align: center;
  margin-top: 3rem;
  color: #ccc;
  font-size: 0.9rem;
}

/* Responsive */
@media (max-width: 768px) {
  nav ul {
    flex-direction: column;
    gap: 0.5rem;
    background: rgba(0,0,0,0.85);
    border-radius: 8px;
    margin-top: 0.5rem;
  }
  nav a {
    display: block;
    text-align: center;
  }
}
</style>
</head>
<body>
<div class="background"></div>
<div class="overlay"></div>

<header>
  <a href="index.html" class="header__logo">
    <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" alt="Logo" />
    Kelas Online
  </a>

  <nav>
    <ul>
      <li><a href="index.html" class="nav__link">Beranda</a></li>
      <li><a href="about.html" class="nav__link">Tentang</a></li>
      <li><a href="courses.html" class="nav__link">Kursus</a></li>
      <li><a href="kontak.html" class="nav__link active">Kontak</a></li>
      <li><a href="login.html" class="btn nav__login">Login</a></li>
    </ul>
  </nav>
</header>

<main>
  <h2>Kontak Kami</h2>
  <p class="description">Punya pertanyaan atau ingin bekerja sama? Silakan kirim pesan Anda melalui formulir di bawah ini.</p>
  
  <form action="#" method="post">
    <input type="text" name="name" placeholder="Nama Anda" required>
    <input type="email" name="email" placeholder="Email Anda" required>
    <textarea name="message" rows="5" placeholder="Pesan Anda" required></textarea>
    <button type="submit">Kirim Pesan</button>
  </form>
</main>

<footer>
  <p>© Kelas Daring 2025. Semua hak dilindungi.</p>
</footer>
</body>
</html>
